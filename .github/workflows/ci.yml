name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      base: ${{ steps.scope.outputs.base }}
      mode: ${{ steps.scope.outputs.mode }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Select CI path
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: >-
          node scripts/ci-scope.mjs
          --base "$CI_BASE_SHA"
          --head "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"

  docs-quality:
    name: Documentation quality
    needs: scope
    if: needs.scope.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version-file: .node-version

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Reject whitespace errors
        env:
          CI_BASE_SHA: ${{ needs.scope.outputs.base }}
        run: git diff --check "$CI_BASE_SHA" "$GITHUB_SHA"

  tests:
    name: Tests / ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version-file: .node-version

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Unit tests
        run: npm run test:ci

  quality:
    name: Quality + platform Evidence / ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version-file: .node-version

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Strict compiler fixture
        run: npm run strict:check

      - name: Build
        run: npm run build

      - name: Check formatting
        run: npm run format:check

      - name: Test packed packages externally
        if: runner.os == 'Linux'
        run: npm run package-smoke:compiled

      - name: Build exact hpi developer-preview artifact
        if: runner.os == 'Linux'
        run: npm run pack:preview:compiled

      - name: Upload hpi developer-preview artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hpi-developer-preview
          path: .artifacts/hpi-developer-preview/hunter-pi-cli-0.1.0-dev.0.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Test a clean locked install
        if: runner.os == 'Linux'
        run: npm run clean-install-smoke

      - name: Check repository prerequisites
        run: npm run doctor

      - name: Probe fixed Pi public interfaces
        run: npm run probe:pi:compiled -- --output .artifacts/pi-probe/${{ runner.os }}.json

      - name: Upload Pi public-interface receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-public-interface-${{ runner.os }}
          path: .artifacts/pi-probe/${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Run Task 9 platform finality probe
        run: >-
          npm run probe:task9:compiled --
          --output .artifacts/task9-platform/${{ runner.os }}.json

      - name: Upload Task 9 platform receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task9-platform-${{ runner.os }}
          path: .artifacts/task9-platform/${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Run Task 10 package-safety probe
        run: >-
          npm run probe:task10:compiled --
          --output .artifacts/task10-platform/${{ runner.os }}.json

      - name: Upload Task 10 platform receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task10-platform-${{ runner.os }}
          path: .artifacts/task10-platform/${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 14

  windows-portable:
    name: Windows x64 portable artifact
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version-file: .node-version

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Build exact Windows x64 portable update artifact
        run: >-
          npm run pack:windows-portable:compiled --
          --output .artifacts/hpi-windows-x64-portable

      - name: Upload Windows x64 portable update artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hpi-windows-x64-portable
          path: .artifacts/hpi-windows-x64-portable/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  windows-package-smoke:
    name: Windows external package smoke
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version-file: .node-version

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test packed packages externally on Windows
        run: npm run package-smoke:compiled

  windows-clean-install:
    name: Windows clean locked install
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version-file: .node-version

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test a clean locked install on Windows
        run: npm run clean-install-smoke

  pi-evidence-consistency:
    name: Pi + Task 9 + Task 10 Evidence / Windows + Ubuntu identity
    needs:
      - scope
      - quality
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version-file: .node-version

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Evidence comparator
        run: npm run build

      - name: Download Windows Pi receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pi-public-interface-Windows
          path: .artifacts/pi-probe-aggregate/windows

      - name: Download Ubuntu Pi receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pi-public-interface-Linux
          path: .artifacts/pi-probe-aggregate/ubuntu

      - name: Compare exact Pi and Hunter execution identities
        run: >-
          node dist/tools/compare-pi-probe-evidence.js
          --windows .artifacts/pi-probe-aggregate/windows/Windows.json
          --ubuntu .artifacts/pi-probe-aggregate/ubuntu/Linux.json
          --output .artifacts/pi-probe-aggregate/consistency.json

      - name: Upload cross-platform consistency receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-public-interface-consistency
          path: .artifacts/pi-probe-aggregate/consistency.json
          if-no-files-found: error
          retention-days: 14

      - name: Download Windows Task 9 receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: task9-platform-Windows
          path: .artifacts/task9-platform-aggregate/windows

      - name: Download Ubuntu Task 9 receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: task9-platform-Linux
          path: .artifacts/task9-platform-aggregate/ubuntu

      - name: Compare exact Task 9 platform identities
        run: >-
          npm run compare:task9-evidence:compiled --
          --windows .artifacts/task9-platform-aggregate/windows/Windows.json
          --ubuntu .artifacts/task9-platform-aggregate/ubuntu/Linux.json
          --output .artifacts/task9-platform-aggregate/consistency.json

      - name: Upload Task 9 consistency receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task9-platform-consistency
          path: .artifacts/task9-platform-aggregate/consistency.json
          if-no-files-found: error
          retention-days: 14

      - name: Download Windows Task 10 receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: task10-platform-Windows
          path: .artifacts/task10-platform-aggregate/windows

      - name: Download Ubuntu Task 10 receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: task10-platform-Linux
          path: .artifacts/task10-platform-aggregate/ubuntu

      - name: Compare exact Task 10 package-safety identities
        run: >-
          npm run compare:task10-evidence:compiled --
          --windows .artifacts/task10-platform-aggregate/windows/Windows.json
          --ubuntu .artifacts/task10-platform-aggregate/ubuntu/Linux.json
          --output .artifacts/task10-platform-aggregate/consistency.json

      - name: Upload Task 10 consistency receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task10-platform-consistency
          path: .artifacts/task10-platform-aggregate/consistency.json
          if-no-files-found: error
          retention-days: 14

  task7-platform:
    name: Task 7 containment / ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version-file: .node-version

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Task 7 probe
        run: npm run build

      - name: Run exact Task 7 platform matrix (attempt 1)
        id: task7_probe
        continue-on-error: true
        run: npm run probe:task7:compiled -- --output .artifacts/task7-platform/${{ runner.os }}.json

      # A hosted process-tree scheduling interruption is retryable only after
      # the probe itself has published a bound TEST_EXECUTION failure receipt.
      # Preserve that receipt so a later pass never erases the failure history.
      - name: Preserve retryable Task 7 failure
        id: task7_retry_gate
        if: steps.task7_probe.outcome == 'failure'
        continue-on-error: true
        env:
          TASK7_RECEIPT_PATH: .artifacts/task7-platform/${{ runner.os }}.json
          TASK7_RETRY_ARTIFACT_PATH: .artifacts/task7-platform/${{ runner.os }}.attempt-1.json
        run: >-
          node -e "const fs = require('node:fs');
          const input = process.env.TASK7_RECEIPT_PATH;
          const preserved = process.env.TASK7_RETRY_ARTIFACT_PATH;
          if (!input || !preserved || !fs.existsSync(input)) process.exit(1);
          const receipt = JSON.parse(fs.readFileSync(input, 'utf8'));
          if (receipt.status !== 'FAIL' || receipt.stage !== 'TEST_EXECUTION') process.exit(1);
          fs.copyFileSync(input, preserved);
          fs.rmSync(input);"

      - name: Retry exact Task 7 platform matrix once
        id: task7_retry
        if: steps.task7_retry_gate.outcome == 'success'
        continue-on-error: true
        run: npm run probe:task7:compiled -- --output .artifacts/task7-platform/${{ runner.os }}.json

      - name: Require a passing Task 7 receipt
        if: always()
        env:
          TASK7_RECEIPT_PATH: .artifacts/task7-platform/${{ runner.os }}.json
        run: >-
          node -e "const fs = require('node:fs');
          const input = process.env.TASK7_RECEIPT_PATH;
          if (!input || !fs.existsSync(input)) process.exit(1);
          const receipt = JSON.parse(fs.readFileSync(input, 'utf8'));
          if (receipt.status !== 'PASS') process.exit(1);"

      - name: Upload Task 7 platform receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task7-platform-${{ runner.os }}
          path: .artifacts/task7-platform/
          if-no-files-found: error
          retention-days: 14

  task7-evidence-consistency:
    name: Task 7 Evidence / Windows + Ubuntu identity
    needs:
      - scope
      - task7-platform
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version-file: .node-version

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Evidence comparator
        run: npm run build

      - name: Download Windows Task 7 receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: task7-platform-Windows
          path: .artifacts/task7-platform-aggregate/windows

      - name: Download Ubuntu Task 7 receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: task7-platform-Linux
          path: .artifacts/task7-platform-aggregate/ubuntu

      - name: Compare exact Task 7 platform identities
        run: >-
          npm run compare:task7-evidence:compiled --
          --windows .artifacts/task7-platform-aggregate/windows/Windows.json
          --ubuntu .artifacts/task7-platform-aggregate/ubuntu/Linux.json
          --output .artifacts/task7-platform-aggregate/consistency.json

      - name: Upload Task 7 consistency receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task7-platform-consistency
          path: .artifacts/task7-platform-aggregate/consistency.json
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - scope
      - docs-quality
      - tests
      - quality
      - windows-portable
      - windows-package-smoke
      - windows-clean-install
      - pi-evidence-consistency
      - task7-platform
      - task7-evidence-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Require the selected path to pass
        env:
          CI_MODE: ${{ needs.scope.outputs.mode }}
          DOCS_RESULT: ${{ needs.docs-quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PORTABLE_RESULT: ${{ needs.windows-portable.result }}
          WINDOWS_PACKAGE_RESULT: ${{ needs.windows-package-smoke.result }}
          WINDOWS_CLEAN_INSTALL_RESULT: ${{ needs.windows-clean-install.result }}
          PLATFORM_EVIDENCE_RESULT: ${{ needs.pi-evidence-consistency.result }}
          TASK7_RESULT: ${{ needs.task7-platform.result }}
          TASK7_EVIDENCE_RESULT: ${{ needs.task7-evidence-consistency.result }}
        run: >-
          node -e "const mode = process.env.CI_MODE;
          const expected = mode === 'docs'
            ? [process.env.DOCS_RESULT]
            : [process.env.TESTS_RESULT, process.env.QUALITY_RESULT,
               process.env.PORTABLE_RESULT, process.env.WINDOWS_PACKAGE_RESULT,
               process.env.WINDOWS_CLEAN_INSTALL_RESULT,
               process.env.PLATFORM_EVIDENCE_RESULT,
               process.env.TASK7_RESULT, process.env.TASK7_EVIDENCE_RESULT];
          if (!['docs', 'full'].includes(mode) || expected.some((value) => value !== 'success')) {
            console.error({ mode, expected });
            process.exit(1);
          }"
